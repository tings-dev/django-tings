<article class="record-card interactive-table-placeholder-card" aria-hidden="true">
  <div class="interactive-table-placeholder-card__heading">&nbsp;</div>
  <dl class="mt-3 grid grid-cols-[minmax(0,1fr)_minmax(0,1fr)] gap-x-4 gap-y-2">
    {% for column in table.display.mobile.summary_columns %}
      <dt>&nbsp;</dt>
      <dd>&nbsp;</dd>
    {% endfor %}
  </dl>
  {% if table.display.mobile.detail_columns %}
    <div class="mt-3 border-t border-border pt-2">
      <div class="interactive-table-placeholder-card__detail">&nbsp;</div>
    </div>
  {% endif %}
</article>
